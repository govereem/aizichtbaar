framework:
    messenger:
        # Uncomment this (and the failed transport below) to send failed messages to this transport for later handling.
        # failure_transport: failed

        transports:
            # https://symfony.com/doc/current/messenger.html#transport-configuration
            async: '%env(MESSENGER_TRANSPORT_DSN)%'
            # failed: 'doctrine://default?queue_name=failed'

        routing:
            # Scans fetch external sites and call the Claude API, so they run in a worker, not in the request.
            'App\Message\RunScanMessage': async
            # Publishing a site fetches it again and calls the AI, so it also runs in a worker.
            'App\Message\PublishSiteMessage': async

when@test:
    framework:
        messenger:
            transports:
                # Run scans inline in tests so they stay deterministic and need no worker.
                async: 'sync://'
